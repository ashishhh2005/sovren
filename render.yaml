# Render deployment config for the Sovren backend.
services:
  - type: web
    name: sovren-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # paste this in the Render dashboard — never committed
