<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sovren</title>
  <!-- React + Babel from a CDN so there's no build step to fight with.
       (On your machine this works as-is; we can switch to Vite later if you want.) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --line:#2a2e38; --ink:#e7e9ee; --muted:#9aa3b2; --accent:#6ea8fe; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:760px; margin:0 auto; padding:32px 16px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 24px; font-size:13px; }
    form { display:flex; gap:8px; margin-bottom:20px; }
    input { flex:1; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:15px; }
    button { padding:12px 18px; border:0; border-radius:8px; background:var(--accent); color:#0b1220; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
    .label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; }
    .answer { white-space:pre-wrap; }
    .chip { display:inline-block; font-size:12px; background:#20242e; border:1px solid var(--line); border-radius:999px; padding:3px 10px; margin:3px 6px 0 0; color:var(--muted); }
    .trace { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:var(--muted); }
    .trace .row { padding:3px 0; border-bottom:1px dashed var(--line); }
    .trace .row:last-child { border:0; }
    .step { color:var(--accent); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    // Where the API lives. Localhost while developing; swap to your Render URL after deploy.
    const API = "http://localhost:8000";

    function App() {
      const [q, setQ] = useState("");
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);

      async function ask(e) {
        e.preventDefault();
        if (!q.trim()) return;
        setLoading(true); setData(null);
        try {
          const res = await fetch(API + "/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q }),
          });
          setData(await res.json());
        } catch (err) {
          setData({ answer: "Could not reach the API. Is the backend running?", trace: [], sources: [] });
        }
        setLoading(false);
      }

      return (
        <div className="wrap">
          <h1>Sovren</h1>
          <p className="sub">A grounded, agentic assistant over a private knowledge base — answers are cited and every step is traceable.</p>
          <form onSubmit={ask}>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="e.g. How many leave days do I get? Or: raise a ticket, my laptop broke." />
            <button disabled={loading}>{loading ? "…" : "Ask"}</button>
          </form>

          {data && (
            <div>
              <div className="card">
                <div className="label">Answer</div>
                <div className="answer">{data.answer}</div>
              </div>

              {data.sources?.length > 0 && (
                <div className="card">
                  <div className="label">Sources</div>
                  {data.sources.map((s, i) => (
                    <span className="chip" key={i}>{s.source} · {s.score}</span>
                  ))}
                </div>
              )}

              {data.trace?.length > 0 && (
                <div className="card">
                  <div className="label">Trace — what the agent did</div>
                  <div className="trace">
                    {data.trace.map((t, i) => (
                      <div className="row" key={i}>
                        <span className="step">{t.step}</span>
                        {t.name ? " · " + t.name : ""}
                        {t.sources ? " · " + t.sources.join(", ") : ""}
                        {t.args ? " · " + JSON.stringify(t.args) : ""}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
